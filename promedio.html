<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedio | Industrial Hub</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #17212b;
            color: white;
            padding: 25px 50px;
        }

        header h1 {
            margin: 0;
        }

        .contenedor {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
        }

        .calculadora {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #667085;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #17212b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #resultado {
            margin-top: 25px;
            padding: 20px;
            background: #f4f6f8;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .volver {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #17212b;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <header>
        <h1>⚙️ Industrial Hub</h1>
    </header>

    <div class="contenedor">

        <div class="calculadora">

            <h2>📊 Calculadora de Promedio</h2>

            <p>Ingresa los números separados por comas.</p>

            <label for="numeros">Números:</label>

            <input
                type="text"
                id="numeros"
                placeholder="Ejemplo: 8, 9, 10, 7, 9"
            >

            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>

            <div id="resultado">
                Resultado aparecerá aquí
            </div>

        </div>
                </div>

        <div class="calculadora" style="margin-top: 25px;">

            <h2>📚 Fórmulas utilizadas</h2>

            <p>
                Para calcular el promedio se utiliza la siguiente fórmula:
            </p>

            <div style="background: #f4f6f8; padding: 20px; border-radius: 10px; text-align: center; font-size: 18px; font-weight: bold;">
                Promedio = Suma de los datos ÷ Cantidad de datos
            </div>

        </div>

        <a href="herramientas.html" class="volver">
            ← Volver a Herramientas
        </a>

        
        </a>

    </div>

    <script>
        function calcularPromedio() {

            const entrada = document.getElementById("numeros").value;

            const numeros = entrada
                .split(",")
                .map(numero => Number(numero.trim()))
                .filter(numero => !isNaN(numero));

            if (numeros.length === 0) {
                document.getElementById("resultado").innerText =
                    "Por favor, ingresa algunos números.";
                return;
            }

            const suma = numeros.reduce(
                (total, numero) => total + numero,
                0
            );

            const promedio = suma / numeros.length;

          document.getElementById("resultado").innerHTML =
    "📊 Resultado<br><br>" +
    "Cantidad de datos: " + numeros.length + "<br>" +
    "Suma: " + suma.toFixed(2) + "<br>" +
    "Promedio: " + promedio.toFixed(2);
        }
    </script>

</body>
</html>
